name: Build Android APK

on:
  push:
    branches:
      - main
      - app-gestao-financeira-oficial
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar dependências NPM
        run: npm install

      - name: 🏗️ Compilar Aplicação Web
        run: npm run build

      - name: 🔄 Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: 🔑 Permissão para gradlew
        run: chmod +x ./android/gradlew

      - name: 🔨 Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Preparar APK para Download
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/GestaoFinanceira.apk

      - name: 📤 Upload Artifact (Download no Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-Financeira-APK
          path: release-output/GestaoFinanceira.apk
          retention-days: 30

      - name: 🚀 Criar Release no GitHub com APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-apk
          name: "📱 Gestão Financeira APK (Moto G52 e Android)"
          body: |
            ## Download do APK para Moto G52 / Android
            Toque no arquivo GestaoFinanceira.apk abaixo para baixar e instalar.
          files: |
            release-output/GestaoFinanceira.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
