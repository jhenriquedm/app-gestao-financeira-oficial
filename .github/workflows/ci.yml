name: CI / Testes e Validação Contínua

on:
  push:
    branches:
      - main
      - app-gestao-financeira-oficial
  pull_request:
    branches:
      - main
      - app-gestao-financeira-oficial
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Testes Unitários e Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔍 Verificação estática e Tipagem (Lint / TypeScript)
        run: npm run lint

      - name: 🧪 Executar Testes Automatizados (Vitest)
        run: npm test

      - name: 🏗️ Validar Build de Produção
        run: npm run build
