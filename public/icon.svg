<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Premium Navy Background Gradient -->
    <linearGradient id="walletBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Wallet Body Sapphire Gradient -->
    <linearGradient id="walletBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Wallet Flap Gradient -->
    <linearGradient id="walletFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Card Top Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Metallic Clasp Gold/Silver Accent -->
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#walletBgGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#softGlow)">
    <!-- Credit Card emerging from wallet -->
    <rect x="140" y="128" width="232" height="130" rx="20" fill="url(#cardGrad)" transform="rotate(-6 256 193)"/>
    <rect x="156" y="148" width="44" height="32" rx="8" fill="#ffffff" fill-opacity="0.3" transform="rotate(-6 256 193)"/>
    
    <!-- Main Wallet Body -->
    <rect x="96" y="180" width="320" height="230" rx="36" fill="url(#walletBodyGrad)"/>
    
    <!-- Inner Top Fold Shade -->
    <path d="M96 216 C96 196.1 112.1 180 132 180 L380 180 C399.9 180 416 196.1 416 216 L416 240 L96 240 Z" fill="#1e3a8a" fill-opacity="0.4"/>

    <!-- Subtle Wallet Rim Light -->
    <rect x="98" y="182" width="316" height="226" rx="34" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.5"/>

    <!-- Horizontal Stitching line -->
    <line x1="120" y1="204" x2="392" y2="204" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.5"/>

    <!-- Wallet Clasp / Flap -->
    <path d="M280 255 L396 255 C410 255 420 266 420 280 L420 310 C420 324 410 335 396 335 L280 335 C270 335 262 327 262 317 L262 273 C262 263 270 255 280 255 Z" fill="url(#walletFlapGrad)"/>
    <path d="M280 255 L396 255 C410 255 420 266 420 280 L420 310 C420 324 410 335 396 335 L280 335 C270 335 262 327 262 317 L262 273 C262 263 270 255 280 255 Z" fill="none" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Metallic Lock / Sensor Button -->
    <circle cx="310" cy="295" r="15" fill="url(#claspGrad)"/>
    <circle cx="310" cy="295" r="6" fill="#1e3a8a"/>
  </g>
</svg>
