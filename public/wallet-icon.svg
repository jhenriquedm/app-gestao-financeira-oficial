<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Sesame Navy Base Gradient -->
    <linearGradient id="sesameBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c3d"/>
      <stop offset="60%" stop-color="#141f2d"/>
      <stop offset="100%" stop-color="#0b121b"/>
    </linearGradient>

    <!-- Emerald Glow / Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Teal-Mint Ring Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#sesameBgGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Sesame-style Geometric Hex-Ring Motif with Emerald Accent -->
  <g filter="url(#softGlow)" transform="translate(4, 0)">
    <!-- Main Slate Navy & Indigo Geometric Ring -->
    <path 
      d="M256 100 L380 172 C395 180 404 196 404 214 L404 358 C404 376 395 392 380 400 L256 472 C240 480 220 480 204 472 L132 430 C116 422 108 406 108 388 L108 214 C108 196 116 180 132 172 L256 100 Z" 
      fill="none" 
      stroke="#2a3b50" 
      stroke-width="38" 
      stroke-linejoin="round"
    />

    <!-- Inner Growth Curve / Financial Loop -->
    <path 
      d="M256 130 L355 188 C366 195 374 207 374 220 L374 340 C374 353 366 365 355 372 L256 430 C245 437 230 437 219 430 L160 395" 
      fill="none" 
      stroke="url(#indigoGrad)" 
      stroke-width="30" 
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Signature Emerald Accent Node / Sesame Segment -->
    <path 
      d="M160 395 L145 385 C136 380 130 370 130 360 L130 220 C130 207 137 195 148 188 L240 135" 
      fill="none" 
      stroke="url(#emeraldGrad)" 
      stroke-width="34" 
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Glowing Emerald Node Center -->
    <circle cx="140" cy="370" r="18" fill="url(#mintGrad)"/>
    <circle cx="256" cy="115" r="14" fill="url(#mintGrad)"/>
  </g>
</svg>
