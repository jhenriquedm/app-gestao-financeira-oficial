name: Build Android APK

on:
  push:
    branches:
      - main
      - app-gestao-financeira-oficial
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurar Java Development Kit (JDK) 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📱 Configurar licenças e SDK Android
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 📦 Instalar dependências NPM
        run: npm install

      - name: 🏗️ Compilar Aplicação Web (Vite)
        run: npm run build

      - name: 🔄 Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: 🔑 Permissão de execução para gradlew
        run: chmod +x ./android/gradlew

      - name: 🔨 Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Preparar APK para Download
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/GestaoFinanceira.apk

      - name: 📤 Upload Artifact (Download no GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-Financeira-APK
          path: release-output/GestaoFinanceira.apk
          retention-days: 30

      - name: 🚀 Criar Release no GitHub com APK para Download Direto
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-apk
          name: "📱 Gestão Financeira APK (Moto G52 e Android)"
          body: |
            ## Download do Aplicativo Android (APK)
            
            Pronto para instalação no seu **Moto G52** ou qualquer dispositivo Android!
            
            ### 📥 Como instalar no seu celular:
            1. Baixe o arquivo **GestaoFinanceira.apk** no link abaixo direto no seu celular.
            2. Toque na notificação de download ou abra pelo gerenciador de arquivos.
            3. Se solicitado, permita a instalação a partir desta fonte (Configurações > Permitir desta fonte).
            4. Toque em **Instalar** e abra seu Gestão Financeira!
            
            *Versão compilada automaticamente com Capacitor e Vite.*
          files: |
            release-output/GestaoFinanceira.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
